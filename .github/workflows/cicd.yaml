name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

jobs:
  cicd:
    name: CI/CD
    uses: dmikalova/project-standards/.github/workflows/cicd.yaml@main
    permissions:
      actions: read
      checks: read
      contents: write
      id-token: write
      packages: write
    secrets: inherit
