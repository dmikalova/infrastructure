# Code generated by project-standards from mklv.config.json. DO NOT EDIT.
#
# This is the project-standards base config with tools.commitlint from
# mklv.config.json merged onto it. Edit mklv.config.json instead, then run
# `mage ci:fix`, or `project-standards fix` without Go, to regenerate it.

disable-default-ignores: false
formatter: default
ignores: []
min-version: v0.12.0
rules:
  - body-leading-blank
  - body-max-line-length
  - description-empty
  - description-full-stop
  - footer-leading-blank
  - footer-max-line-length
  - header-max-length
  - header-trim
  - type-case
  - type-empty
  - type-enum
settings:
  body-leading-blank: {}
  body-max-line-length:
    argument: 100
  description-empty: {}
  description-full-stop:
    argument: .
  footer-leading-blank: {}
  footer-max-line-length:
    argument: 100
  header-max-length:
    argument: 100
  header-trim: {}
  type-case:
    argument: lower-case
  type-empty: {}
  type-enum:
    argument:
      - build
      - chore
      - ci
      - docs
      - feat
      - fix
      - perf
      - refactor
      - revert
      - style
      - test
severity:
  default: error
  rules:
    body-leading-blank: warn
    footer-leading-blank: warn
